name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

      # The price table is generated, not hand-maintained. If the JSON and the
      # generator disagree, someone edited a price directly — which is exactly
      # the change nobody reviews closely enough.
      - name: price table matches its generator
        run: |
          python3 prices/gen/build_prices.py
          git diff --exit-code -- prices/prices-2026-06-15.json
